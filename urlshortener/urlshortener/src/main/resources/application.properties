spring.application.name=urlshortener

# Configuração MongoDB - USE APENAS UMA DAS OPÇÕES ABAIXO:

# OPÇÃO 1: URI completa (RECOMENDADA)
spring.data.mongodb.uri=mongodb://admin:123@localhost:27017/shortenerdb?authSource=admin

# OPÇÃO 2: Configuração separada (comente a URI acima se usar esta opção)
# spring.data.mongodb.host=localhost
# spring.data.mongodb.port=27017
# spring.data.mongodb.database=shortenerdb
# spring.data.mongodb.username=admin
# spring.data.mongodb.password=123
# spring.data.mongodb.authentication-database=admin

# Configuração de índices
spring.data.mongodb.auto-index-creation=true

# GeoIP Configuration
geoip.database.path=src/main/resources/GeoLite2-City.mmdb

# Logging configuration
logging.level.desafiourl.urlshortener.service.GeoLocationService=INFO
logging.level.org.springframework.data.mongodb=DEBUG