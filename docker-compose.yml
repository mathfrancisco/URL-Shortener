version: '3.8'

services:
  mongodb:
    image: mongo:7-jammy
    container_name: urlshortener_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: shortenerdb
    volumes:
      - mongodb_data:/data/db
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - urlshortener-network

volumes:
  mongodb_data:
    driver: local

networks:
  urlshortener-network:
    driver: bridge